for(const b of document.querySelectorAll('[data-k]')){let k=b.dataset.k,lastDown=-1000;b.addEventListener('pointerdown',ev=>{ev.preventDefault();lastDown=performance.now();keys[k]=true;b.classList.add('on');try{b.setPointerCapture(ev.pointerId)}catch(_){}action(k)});let up=()=>{keys[k]=false;b.classList.remove('on')};for(let ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,up);b.addEventListener('click',()=>{if(performance.now()-lastDown>500)action(k)})}const km={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'jump',z:'punch',x:'kick',c:'throw',v:'guard',b:'roll',' ':'special'};window.addEventListener('keydown',ev=>{let k=km[ev.key];if(k){ev.preventDefault();if(!keys[k])action(k);keys[k]=true}});window.addEventListener('keyup',ev=>{if(km[ev.key])keys[km[ev.key]]=false});window.addEventListener('blur',()=>keys={});for(const k of ['dblclick','gesturestart','gesturechange','gestureend'])document.addEventListener(k,e=>e.preventDefault(),{passive:false});document.addEventListener('touchstart',e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});let lastTap=0;document.addEventListener('touchend',e=>{let t=performance.now();if(lastTap&&t-lastTap<350&&e.target.closest('[data-k]'))e.preventDefault();lastTap=t},{passive:false});
