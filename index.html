<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ひとり商店。</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: one narrow column like a pocket diary — room diorama on top, next events as stickers, history as quiet stamped entries */
:root{
  --bg:#EEF2EA; --paper:#FFFFFF; --ink:#22302B; --muted:#66756D; --line:#D6DFD3;
  --accent:#2D63D8; --accent-soft:#E2EAFB; --sticker:#FFCF3F; --pink:#F08BA6; --leaf:#4E9A62; --danger:#C2365C;
  --wall:#E4ECF6; --wall2:#D5E1EF; --floor:#D7B58A; --floor2:#C9A374; --wood:#9C6B43; --sky:#BFE1F5;
  --display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Noto Sans JP",sans-serif;
  --body:"Noto Sans JP","Hiragino Sans",system-ui,sans-serif;
  --mono:"DM Mono",ui-monospace,"SFMono-Regular",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151B18; --paper:#1F2723; --ink:#EDF2EC; --muted:#9AA79F; --line:#33403A;
  --accent:#86A8FF; --accent-soft:#25304A; --sticker:#F2C43A; --pink:#E98AA4; --leaf:#67B47B; --danger:#FF8FAE;
  --wall:#27313D; --wall2:#2F3B49; --floor:#6A5238; --floor2:#5C4630; --wood:#8A5F3C; --sky:#3C5C73; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151B18; --paper:#1F2723; --ink:#EDF2EC; --muted:#9AA79F; --line:#33403A;
  --accent:#86A8FF; --accent-soft:#25304A; --sticker:#F2C43A; --pink:#E98AA4; --leaf:#67B47B; --danger:#FF8FAE;
  --wall:#27313D; --wall2:#2F3B49; --floor:#6A5238; --floor2:#5C4630; --wood:#8A5F3C; --sky:#3C5C73; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
.days .until{display:block;font-size:.8rem;font-weight:500}
.days .until b{font-size:.95rem}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.7;padding-inline:16px;padding-block:20px 48px}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.shopname{font-family:var(--display);font-weight:900;font-size:1.7rem;line-height:1.2;background:none;border:0;padding:0;text-align:left;text-wrap:balance}
.days{font-family:var(--display);font-weight:700;color:var(--muted);font-size:.95rem}
.days b{color:var(--ink);font-family:var(--mono);font-size:1.15rem}
.chapter{flex-shrink:0;font-family:var(--display);font-weight:700;font-size:.8rem;letter-spacing:.06em;background:var(--sticker);color:#2B2410;padding:4px 10px;border-radius:999px;transform:rotate(3deg);margin-top:6px}
.sample{font-size:.78rem;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sample span{background:var(--accent-soft);color:var(--accent);padding:1px 8px;border-radius:4px;font-weight:700}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:3px;font-size:.78rem}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{display:flex;flex-direction:column;gap:0}
.stat small{font-size:.72rem;color:var(--muted);letter-spacing:.08em}
.stat .num{font-size:1.05rem;font-weight:500}
.stat.profit .num{color:var(--accent)}

/* room */
.room{position:relative;border-radius:18px;overflow:hidden;border:2px solid var(--ink);background:var(--wall)}
.room svg{display:block;width:100%;height:auto}
.it{opacity:0;transform-box:fill-box;transform-origin:50% 100%;transform:scale(.6) translateY(6px);transition:opacity .35s,transform .45s cubic-bezier(.3,1.6,.5,1)}
.it.on{opacity:1;transform:none}
.roomhint{position:absolute;left:10px;bottom:8px;font-size:.72rem;background:var(--paper);color:var(--muted);padding:2px 8px;border-radius:6px;border:1px solid var(--line)}

/* now button */
.nowbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border-radius:14px;border:2px solid var(--ink);background:var(--accent);color:#fff;font-family:var(--display);font-weight:700;font-size:1.05rem;box-shadow:0 4px 0 var(--ink);transition:transform .1s,box-shadow .1s}
:root[data-theme="dark"] .nowbtn{color:#10172A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .nowbtn{color:#10172A}}
.nowbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}

/* sections */
h2{font-family:var(--display);font-weight:700;font-size:1.05rem;margin:0 0 10px;display:flex;align-items:baseline;gap:8px}
h2 small{font-family:var(--body);font-weight:400;font-size:.75rem;color:var(--muted)}
.events{display:flex;flex-direction:column;gap:10px}
.ev{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;transition:transform .15s,border-color .15s}
.ev:hover{border-color:var(--ink);transform:rotate(-.6deg)}
.ev .ic{font-size:1.4rem;width:2rem;text-align:center;flex-shrink:0}
.ev .t{font-weight:700;display:block;line-height:1.4}
.ev .s{font-size:.78rem;color:var(--muted);display:block}
.ev .go{margin-left:auto;color:var(--muted);flex-shrink:0}
.due{display:block;font-size:.76rem;font-family:var(--mono);color:var(--accent);margin-top:2px}
.due.urgent{color:var(--danger);font-weight:500}
.duebox{background:var(--bg);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.duebox .due{font-size:.9rem;margin:0}
.duebox small{font-size:.76rem;color:var(--muted)}
.empty{color:var(--muted);font-size:.88rem}

/* month */
.month{background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:2px;flex:1 1 110px;min-width:0}
.field label{font-size:.72rem;color:var(--muted);letter-spacing:.05em}
input{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
input[type=number],input[type=month],input[type=date]{font-family:var(--mono)}
.btn{border:2px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:10px;padding:9px 16px;font-weight:700}
.btn.ghost{background:transparent;color:var(--ink)}
.mlist{font-size:.82rem;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.mlist div{display:flex;justify-content:space-between;gap:8px;border-top:1px dashed var(--line);padding-top:4px}

/* history */
.history{display:flex;flex-direction:column}
.hist-head{font-family:var(--display);font-weight:900;letter-spacing:.14em;font-size:.95rem;margin-bottom:6px}
.h{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;padding:12px 0;border-top:1px solid var(--line)}
.h .d{font-family:var(--mono);font-size:.82rem;color:var(--muted);line-height:1.5}
.h .d em{display:block;font-style:normal;font-size:.72rem}
.h .ti{font-weight:700;line-height:1.5;min-width:0}
.h .ti .amt{font-family:var(--mono);font-weight:500;color:var(--accent);margin-left:6px}
.h .memo{grid-column:2;font-size:.85rem;color:var(--muted);min-width:0}
.h.fresh .ti{animation:flash 1.6s}
.h{cursor:pointer;margin-inline:-8px;padding-inline:8px;border-radius:6px;transition:background .15s}
.h:hover,.h:focus-visible{background:var(--accent-soft)}
.hint{font-family:var(--body);font-weight:400;font-size:.72rem;color:var(--muted);letter-spacing:0;margin-left:8px}
.mrow{cursor:pointer}
.mrow:hover span,.mrow:focus-visible span{color:var(--accent)}
.acts .left{margin-right:auto}
.sheet form>.field{flex:none}
.err{margin:0;color:var(--danger);font-weight:700;font-size:.85rem}
@keyframes flash{0%{background:var(--sticker)}100%{background:transparent}}

/* sheet */
.veil{position:fixed;inset:0;background:rgba(10,16,13,.45);display:flex;align-items:center;justify-content:center;z-index:10;padding:16px}
.sheet{background:var(--paper);width:100%;max-width:440px;border:2px solid var(--ink);border-radius:20px;padding:22px 18px 20px;max-height:86vh;overflow:auto;display:flex;flex-direction:column;gap:14px;animation:up .28s ease-out}
@keyframes up{from{transform:scale(.94);opacity:0}}
.sheet h3{font-family:var(--display);font-weight:900;font-size:1.3rem;margin:0;line-height:1.35;text-wrap:balance}
.steps{display:flex;gap:6px}
.steps span{flex:1;font-size:.72rem;text-align:center;padding:4px 0;border-radius:6px;background:var(--bg);color:var(--muted);font-weight:700}
.steps span.cur{background:var(--accent);color:var(--paper)}
.steps span.done{background:var(--accent-soft);color:var(--accent)}
.sheet p{margin:0}
.sheet ul{margin:0;padding-left:1.2em}
.acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.check{display:flex;flex-direction:column;gap:4px;font-size:.92rem}
.check div{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:3px 0}
.check .ok{color:var(--leaf);font-weight:700}
.check .no{color:var(--muted)}
.reco{background:var(--accent-soft);border-radius:12px;padding:12px 14px}
.reco b{font-family:var(--display);font-size:1.1rem;color:var(--accent)}
.warn{font-size:.85rem;color:var(--muted)}

/* celebration */
.cele{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(10,16,13,.55);padding:16px}
.card{background:var(--paper);border:2px solid var(--ink);border-radius:20px;padding:26px 22px 20px;max-width:340px;width:100%;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.7) rotate(-6deg);opacity:0}}
.stamp{width:92px;height:92px;border-radius:50%;border:3px solid var(--pink);color:var(--pink);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--display);font-weight:900;transform:rotate(-12deg);line-height:1.1}
.stamp .e{font-size:1.8rem}
.stamp .n{font-size:.62rem;letter-spacing:.06em}
.card h4{font-family:var(--display);font-weight:900;font-size:1.35rem;margin:6px 0 0}
.card p{margin:0;color:var(--muted);font-size:.9rem}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:21;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:8px;height:12px;border-radius:2px;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header style="display:flex;flex-direction:column;gap:6px">
    <div class="top">
      <div>
        <button class="shopname" id="shopname" aria-label="屋号と開業日を編集"></button>
        <div class="days" id="days"></div>
      </div>
      <div class="chapter" id="chapter"></div>
    </div>
    <div class="sample" id="sampleBar"><span>サンプル</span>表示中の数字と記録は見本です。<button class="linkbtn" id="resetBtn">まっさらから始める</button></div>
  </header>

  <div class="stats">
    <div class="stat"><small>累計売上</small><span class="num" id="sSales"></span></div>
    <div class="stat"><small>累計経費</small><span class="num" id="sExp"></span></div>
    <div class="stat profit"><small>利益</small><span class="num" id="sProfit"></span></div>
  </div>

  <div class="room" aria-label="仕事部屋">
    <svg viewBox="0 0 360 250" role="img" aria-label="自分の仕事部屋のイラスト。出来事を記録すると物が増える">
      <!-- awning: 初確定申告 -->
      <rect x="0" y="0" width="360" height="178" style="fill:var(--wall)"/>
      <rect x="0" y="150" width="360" height="28" style="fill:var(--wall2)"/>
      <rect x="0" y="178" width="360" height="72" style="fill:var(--floor)"/>
      <g style="stroke:var(--floor2)" stroke-width="2"><line x1="0" y1="205" x2="360" y2="205"/><line x1="0" y1="230" x2="360" y2="230"/></g>
      <!-- window -->
      <rect x="244" y="36" width="88" height="72" rx="4" style="fill:var(--sky);stroke:var(--ink)" stroke-width="3"/>
      <line x1="288" y1="36" x2="288" y2="108" style="stroke:var(--ink)" stroke-width="3"/>
      <line x1="244" y1="72" x2="332" y2="72" style="stroke:var(--ink)" stroke-width="3"/>
      <!-- desk (always) -->
      <rect x="112" y="150" width="152" height="10" rx="2" style="fill:var(--wood);stroke:var(--ink)" stroke-width="2.5"/>
      <rect x="122" y="160" width="8" height="40" style="fill:var(--wood);stroke:var(--ink)" stroke-width="2"/>
      <rect x="246" y="160" width="8" height="40" style="fill:var(--wood);stroke:var(--ink)" stroke-width="2"/>

      <g class="it" data-k="shinkoku">
        <path d="M0 0H360V14Q351 26 342 14Q333 26 324 14Q315 26 306 14Q297 26 288 14Q279 26 270 14Q261 26 252 14Q243 26 234 14Q225 26 216 14Q207 26 198 14Q189 26 180 14Q171 26 162 14Q153 26 144 14Q135 26 126 14Q117 26 108 14Q99 26 90 14Q81 26 72 14Q63 26 54 14Q45 26 36 14Q27 26 18 14Q9 26 0 14Z" style="fill:var(--pink);stroke:var(--ink)" stroke-width="2"/>
        <g style="fill:var(--paper)" opacity=".85"><rect x="18" y="0" width="18" height="14"/><rect x="54" y="0" width="18" height="14"/><rect x="90" y="0" width="18" height="14"/><rect x="126" y="0" width="18" height="14"/><rect x="162" y="0" width="18" height="14"/><rect x="198" y="0" width="18" height="14"/><rect x="234" y="0" width="18" height="14"/><rect x="270" y="0" width="18" height="14"/><rect x="306" y="0" width="18" height="14"/><rect x="342" y="0" width="18" height="14"/></g>
      </g>
      <!-- sign: 屋号 -->
      <g class="it" data-k="yago">
        <line x1="40" y1="22" x2="40" y2="34" style="stroke:var(--ink)" stroke-width="2"/>
        <line x1="150" y1="22" x2="150" y2="34" style="stroke:var(--ink)" stroke-width="2"/>
        <rect x="24" y="32" width="142" height="34" rx="6" style="fill:var(--paper);stroke:var(--ink)" stroke-width="3"/>
        <text id="signText" x="95" y="55" text-anchor="middle" style="fill:var(--ink);font-family:var(--display);font-weight:900;font-size:16px"></text>
      </g>
      <!-- OPEN: 開業届 -->
      <g class="it" data-k="kaigyo">
        <line x1="78" y1="66" x2="70" y2="78" style="stroke:var(--ink)" stroke-width="1.5"/>
        <line x1="112" y1="66" x2="120" y2="78" style="stroke:var(--ink)" stroke-width="1.5"/>
        <rect x="62" y="78" width="66" height="22" rx="4" style="fill:var(--sticker);stroke:var(--ink)" stroke-width="2.5"/>
        <text x="95" y="94" text-anchor="middle" style="fill:#2B2410;font-family:var(--mono);font-weight:500;font-size:13px;letter-spacing:2px">OPEN</text>
      </g>
      <!-- calendar: 開業日 -->
      <g class="it" data-k="opendate">
        <rect x="186" y="44" width="38" height="44" rx="3" style="fill:var(--paper);stroke:var(--ink)" stroke-width="2.5"/>
        <rect x="186" y="44" width="38" height="12" rx="3" style="fill:var(--pink);stroke:var(--ink)" stroke-width="2.5"/>
        <text x="205" y="81" text-anchor="middle" style="fill:var(--ink);font-family:var(--mono);font-size:16px">1</text>
      </g>
      <!-- shelf: 売上10万 -->
      <g class="it" data-k="sales10">
        <rect x="14" y="118" width="88" height="6" style="fill:var(--wood);stroke:var(--ink)" stroke-width="2"/>
        <rect x="20" y="96" width="10" height="22" style="fill:var(--accent);stroke:var(--ink)" stroke-width="1.5"/>
        <rect x="31" y="100" width="10" height="18" style="fill:var(--sticker);stroke:var(--ink)" stroke-width="1.5"/>
        <rect x="42" y="94" width="10" height="24" style="fill:var(--pink);stroke:var(--ink)" stroke-width="1.5"/>
      </g>
      <!-- trophy: 単価を上げた -->
      <g class="it" data-k="raise">
        <path d="M74 98h18v6q0 9-9 9t-9-9z" style="fill:var(--sticker);stroke:var(--ink)" stroke-width="1.8"/>
        <rect x="79" y="112" width="8" height="6" style="fill:var(--sticker);stroke:var(--ink)" stroke-width="1.5"/>
      </g>
      <!-- frame: リピーター -->
      <g class="it" data-k="repeat">
        <rect x="200" y="100" width="32" height="26" rx="2" style="fill:var(--paper);stroke:var(--ink)" stroke-width="2.5"/>
        <path d="M216 120c-6-4-8-7-6-9.5 1.5-1.8 4.5-1 6 1.2 1.5-2.2 4.5-3 6-1.2 2 2.5 0 5.5-6 9.5z" style="fill:var(--pink)"/>
      </g>
      <!-- pc: 会計ソフト -->
      <g class="it" data-k="software">
        <rect x="196" y="116" width="52" height="34" rx="3" style="fill:var(--ink)"/>
        <rect x="200" y="120" width="44" height="24" style="fill:var(--accent-soft)"/>
        <polyline points="204,138 214,132 222,135 238,124" fill="none" style="stroke:var(--accent)" stroke-width="2.5"/>
      </g>
      <!-- register: 事業口座 -->
      <g class="it" data-k="bank">
        <rect x="124" y="126" width="44" height="24" rx="3" style="fill:var(--accent);stroke:var(--ink)" stroke-width="2.5"/>
        <rect x="130" y="118" width="26" height="10" rx="2" style="fill:var(--paper);stroke:var(--ink)" stroke-width="2"/>
        <g style="fill:var(--paper)"><rect x="130" y="134" width="6" height="4"/><rect x="139" y="134" width="6" height="4"/><rect x="148" y="134" width="6" height="4"/><rect x="130" y="141" width="6" height="4"/><rect x="139" y="141" width="6" height="4"/></g>
      </g>
      <!-- envelope: 初請求 -->
      <g class="it" data-k="invoice">
        <rect x="172" y="136" width="22" height="14" style="fill:var(--paper);stroke:var(--ink)" stroke-width="2"/>
        <polyline points="172,136 183,145 194,136" fill="none" style="stroke:var(--ink)" stroke-width="1.8"/>
      </g>
      <!-- ledger: 初経費 -->
      <g class="it" data-k="expense">
        <rect x="170" y="128" width="24" height="7" rx="1" style="fill:var(--leaf);stroke:var(--ink)" stroke-width="1.8"/>
      </g>
      <!-- card: 事業用カード -->
      <g class="it" data-k="card">
        <rect x="250" y="141" width="12" height="9" rx="1.5" style="fill:var(--sticker);stroke:var(--ink)" stroke-width="1.5"/>
      </g>
      <!-- memo: 見積書 -->
      <g class="it" data-k="estimate">
        <rect x="108" y="128" width="12" height="16" style="fill:var(--sticker);stroke:var(--ink)" stroke-width="1.5" transform="rotate(-8 114 136)"/>
      </g>
      <!-- plant: 初入金 -->
      <g class="it" data-k="payment">
        <ellipse cx="300" cy="166" rx="10" ry="18" style="fill:var(--leaf);stroke:var(--ink)" stroke-width="2" transform="rotate(-25 300 166)"/>
        <ellipse cx="318" cy="164" rx="10" ry="20" style="fill:var(--leaf);stroke:var(--ink)" stroke-width="2" transform="rotate(22 318 164)"/>
        <ellipse cx="309" cy="156" rx="8" ry="20" style="fill:var(--leaf);stroke:var(--ink)" stroke-width="2"/>
        <path d="M294 182h30l-4 26h-22z" style="fill:var(--pink);stroke:var(--ink)" stroke-width="2.5"/>
      </g>
      <!-- corkboard: 年金・保険・失業保険・県の届け出 -->
      <g class="it" data-any="nenkin kenpo koyo kenzei">
        <rect x="136" y="72" width="44" height="40" rx="3" style="fill:var(--floor);stroke:var(--ink)" stroke-width="2.5"/>
      </g>
      <g class="it" data-k="nenkin"><rect x="141" y="77" width="14" height="13" style="fill:var(--accent)"/></g>
      <g class="it" data-k="kenpo"><rect x="160" y="77" width="14" height="13" style="fill:var(--pink)" transform="rotate(6 167 83)"/></g>
      <g class="it" data-k="koyo"><rect x="141" y="94" width="14" height="13" style="fill:var(--sticker)" transform="rotate(-5 148 100)"/></g>
      <g class="it" data-k="kenzei">
        <circle cx="167" cy="100" r="7" style="fill:var(--paper);stroke:var(--danger)" stroke-width="2"/>
        <text x="167" y="103.5" text-anchor="middle" style="fill:var(--danger);font-family:var(--display);font-weight:900;font-size:9px">県</text>
      </g>

function addMonths(d,n){const x=new Date(d+'T00:00'),day=x.getDate();x.setMonth(x.getMonth()+n);if(x.getDate()<day)x.setDate(0);return ymd(x)}

function deadlineOf(k,today){

  const base=d.base==='quit'?quitDate():S.start;
  if(!base||!DATE_RE.test(base))return{need:d.base,note:d.note};
  const date=d.calc(base);
  return{date,left:daysSince(today,date)-1,note:d.note};
}

}

  const prep=daysSince(quitDate(),today);
  const left=open!=null?'開業まで あと <b>'+(1-open)+'</b> 日':'';
  if(prep!=null&&prep>=1)return'準備 <b>'+prep+'</b> 日目'+(left?'<span class="until">'+left+'</span>':'');
  if(left)return left;
  return'会社を辞めた日から、準備期を数えはじめます';
}

function render(){
  $('shopname').textContent=shopName();
  $('signText').textContent=shopName().slice(0,8);
  $('days').innerHTML=headerDays(todayStr());
  $('chapter').textContent='第'+(curChapter()+1)+'章 '+CHAPTERS[curChapter()];
  $('sampleBar').hidden=!S.sample;
  const t=totals();$('sSales').textContent=yen(t.s);$('sExp').textContent=yen(t.e);$('sProfit').textContent=yen(t.p);
  // data-k: shown when that event is done; data-any: shown when any of the listed events is done.
  document.querySelectorAll('.it').forEach(g=>g.classList.toggle('on',(g.dataset.any||g.dataset.k).split(' ').some(k=>S.done[k])));
  const cnt=Object.keys(S.done).length;
  $('roomhint').textContent=cnt?'部屋のもの '+cnt+' / '+EVENTS.length:'まだ何もない部屋。出来事を記録すると物が増えます';
  // next events
  const next=EVENTS.filter(e=>!e.auto&&!S.done[e.k]).sort((a,b)=>a.ch-b.ch).slice(0,3);
  $('events').innerHTML=next.length?next.map(evCard).join(''):'<p class="empty">用意した出来事はすべて記録しました。</p>';
  $('events').querySelectorAll('.ev').forEach(b=>b.onclick=()=>openEvent(b.dataset.k));
  // months
  const ms=Object.keys(S.months).sort().reverse();
  $('mlist').innerHTML=ms.map(m=>`<div class="mrow" role="button" tabindex="0" data-m="${esc(m)}" aria-label="${esc(fmtMonth(m))}のお金を直す"><span class="num">${esc(fmtMonth(m))}</span><span class="num">売上 ${yen(S.months[m].s)} / 経費 ${yen(S.months[m].e)}</span></div>`).join('');
  bindTap($('mlist').querySelectorAll('.mrow'),el=>openMonth(el.dataset.m));
  // history
  const hs=Object.entries(S.done).filter(([k])=>BYK[k]).sort((a,b)=>a[1].date<b[1].date?-1:a[1].date>b[1].date?1:0);
  $('history').innerHTML=hs.length?hs.map(([k,v])=>{const e=BYK[k];
    return `<div class="h${v.fresh?' fresh':''}" role="button" tabindex="0" data-k="${k}" aria-label="「${esc(e.done)}」の記録を直す"><div class="d">${fmtDate(v.date)}<em>${dayLabel(v.date)}</em></div><div class="ti">${esc(e.done)}${v.amount!=null?`<span class="amt">${yen(v.amount)}</span>`:''}</div>${v.memo?`<div class="memo">${esc(v.memo)}</div>`:''}</div>`}).join('')
    :'<p class="empty">最初の出来事を記録すると、ここに年表ができていきます。</p>';
  bindTap($('history').querySelectorAll('.h'),el=>openEdit(el.dataset.k));
  hs.forEach(([,v])=>delete v.fresh);
}

// One card in "次の出来事".
function evCard(e){
  const dl=deadlineOf(e.k,todayStr());
  const due=dl?`<span class="${dueClass(dl)}">${esc(dueText(dl))}</span>`:'';
  return `<button class="ev" data-k="${e.k}"><span class="ic" aria-hidden="true">${e.ic}</span><span><span class="t">${esc(e.rec)}</span><span class="s">${esc(e.t)}　·　第${e.ch+1}章 ${CHAPTERS[e.ch]}</span>${due}</span><span class="go" aria-hidden="true">›</span></button>`;
}

// --- small UI helpers ---
function fmtMonth(m){return m.replace('-','.')}
function bindTap(nodes,fn){nodes.forEach(el=>{el.onclick=()=>fn(el);el.onkeydown=ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();fn(el)}}})}
function showErr(id,msg){const el=$(id);el.textContent=msg;el.hidden=false}

// --- state operations (no DOM) ---
// Any change by the user makes the data theirs, so it is no longer treated as the sample.
function applyRecord(k,rec,extra){
  S.sample=false;
  if(k==='yago'&&extra&&extra.name!=null)S.name=extra.name;
  if(k==='opendate')S.start=rec.date;
  S.done[k]=rec;
}
function removeRecord(k){
  S.sample=false;
  delete S.done[k];
  if(k==='yago')S.name='';
  if(k==='opendate')S.start='';
}
function setMonth(m,v){S.sample=false;S.months[m]=v}
function removeMonth(m){S.sample=false;delete S.months[m]}

// --- validation (no DOM) ---
const DATE_RE=/^\d{4}-\d{2}-\d{2}$/, MONTH_RE=/^\d{4}-\d{2}$/;
function parseYen(str,{optional}={}){ // '' → 0 (or null when optional); returns NaN when invalid
  const s=String(str??'').trim();
  if(s==='')return optional?null:0;
  const n=Number(s);
  return Number.isInteger(n)&&n>=0?n:NaN;
}

// --- record form (shared by "できた！" and edit) ---
function recordFields(k,rec){
  const e=BYK[k];
  return `${k==='yago'?`<div class="field"><label for="fName">屋号</label><input id="fName" required maxlength="20" value="${esc(S.name)}" placeholder="例：かな商店"></div>`:''}
    <div class="field"><label for="fDate">${k==='opendate'?'開業日':'記録する日'}</label><input type="date" id="fDate" required value="${esc(rec.date||'')}"></div>
    ${e.amount?`<div class="field"><label for="fAmt">金額（円・任意）</label><input type="number" id="fAmt" min="0" step="1" inputmode="numeric" value="${rec.amount!=null?rec.amount:''}"></div>`:''}
    <div class="field"><label for="fMemo">ひとことメモ（任意）</label><input id="fMemo" maxlength="80" placeholder="今日のこと、ひとこと" value="${esc(rec.memo||'')}"></div>
    <p class="err" id="fErr" hidden></p>`;
}
function readRecordForm(k){
  const date=$('fDate').value;
  if(!DATE_RE.test(date))return{err:'日付を入れてください。'};
  const rec={date};
  if($('fAmt')){const a=parseYen($('fAmt').value,{optional:true});if(Number.isNaN(a))return{err:'金額は0以上の整数で入れてください。'};if(a!=null)rec.amount=a}
  const m=$('fMemo').value.trim();if(m)rec.memo=m.slice(0,80);
  const extra={};
  if(k==='yago'){const nm=$('fName').value.trim();if(!nm)return{err:'屋号を入れてください。'};extra.name=nm.slice(0,20)}
  return{rec,extra};
}

function openEdit(k,confirmDel){
  const e=BYK[k],rec=S.done[k];if(!e||!rec)return;
  if(confirmDel){
    sheet(`<h3>「${esc(e.done)}」の記録を取り消しますか？</h3><p class="warn">年表と部屋から消えて、「${esc(e.t)}」は次の出来事に戻ります。</p>
      <div class="acts"><button class="btn ghost" id="x">やめる</button><button class="btn" id="doDel">取り消す</button></div>`);
    $('x').onclick=()=>openEdit(k);
    $('doDel').onclick=()=>{removeRecord(k);save();close();render()};
    return;
  }
  sheet(`<div style="font-size:1.8rem" aria-hidden="true">${e.ic}</div><h3>${esc(e.done)}</h3>
    <form id="editForm" novalidate style="display:flex;flex-direction:column;gap:10px">${recordFields(k,rec)}
    ${e.auto?'<p class="warn">売上から自動でついた記録です。日付とメモを直せます。</p>':''}
    <div class="acts">${e.auto?'':'<button type="button" class="btn ghost left" id="toDel">取り消す</button>'}<button type="button" class="btn ghost" id="x">キャンセル</button><button class="btn" type="submit">保存</button></div></form>`);
  $('x').onclick=close;
  $('toDel')&&($('toDel').onclick=()=>openEdit(k,true));
  $('editForm').onsubmit=ev=>{ev.preventDefault();
    const r=readRecordForm(k);if(r.err)return showErr('fErr',r.err);
    applyRecord(k,r.rec,r.extra);save();close();render();checkAuto();};
}

function openMonth(m,confirmDel){
  const v=S.months[m];if(!v)return;
  if(confirmDel){
    sheet(`<h3>${esc(fmtMonth(m))} のお金を消しますか？</h3><p class="warn">この月の売上と経費が消え、累計も変わります。</p>
      <div class="acts"><button class="btn ghost" id="x">やめる</button><button class="btn" id="doDel">消す</button></div>`);
    $('x').onclick=()=>openMonth(m);
    $('doDel').onclick=()=>{removeMonth(m);save();close();render();checkAuto()};
    return;
  }
  sheet(`<h3>${esc(fmtMonth(m))} のお金</h3>
    <form id="mEdit" novalidate style="display:flex;flex-direction:column;gap:10px"><div class="row">
      <div class="field"><label for="eSales">売上（円）</label><input type="number" id="eSales" min="0" step="1" inputmode="numeric" value="${v.s}"></div>
      <div class="field"><label for="eExp">経費（円）</label><input type="number" id="eExp" min="0" step="1" inputmode="numeric" value="${v.e}"></div></div>
      <p class="err" id="fErr" hidden></p>
      <div class="acts"><button type="button" class="btn ghost left" id="toDel">この月を消す</button><button type="button" class="btn ghost" id="x">キャンセル</button><button class="btn" type="submit">保存</button></div></form>`);
  $('x').onclick=close;
  $('toDel').onclick=()=>openMonth(m,true);
  $('mEdit').onsubmit=ev=>{ev.preventDefault();
    const s=parseYen($('eSales').value),x=parseYen($('eExp').value);
    if(Number.isNaN(s)||Number.isNaN(x))return showErr('fErr','金額は0以上の整数で入れてください。');
    setMonth(m,{s,e:x});save();close();render();checkAuto();};
}

function sheet(html){$('layer').innerHTML=`<div class="veil" id="veil"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;$('veil').onclick=e=>{if(e.target.id==='veil')close()};}
function close(){$('layer').innerHTML=''}

function openEvent(k,step=0){
  const e=BYK[k];
  const st=['なぜ必要？','どうやる？','できた！'].map((s,i)=>`<span class="${i===step?'cur':i<step?'done':''}">${s}</span>`).join('');
  let body='';
  const dl=deadlineOf(k,todayStr());
  const dueBox=dl?`<div class="duebox"><span class="${dueClass(dl)}">${esc(dueText(dl))}</span><small>${esc(dl.note)}。日付は目安なので、正確な期限は窓口の案内で確認してね。</small></div>`:'';
  if(step===0)body=`<p>${esc(e.why)}</p>${dueBox}<div class="acts"><button class="btn ghost" id="x">あとで</button><button class="btn" id="nx">どうやる？</button></div>`;
  if(step===1)body=`<ul>${e.how.map(h=>`<li>${esc(h)}</li>`).join('')}</ul><div class="acts"><button class="btn ghost" id="bk">戻る</button><button class="btn" id="nx">できた！</button></div>`;
  if(step===2)body=`<form id="doneForm" novalidate style="display:flex;flex-direction:column;gap:10px">
    ${recordFields(k,{date:k==='opendate'&&S.start?S.start:todayStr()})}
    <div class="acts"><button type="button" class="btn ghost" id="bk">戻る</button><button class="btn" type="submit">記録する</button></div></form>`;
  sheet(`<div style="font-size:1.8rem" aria-hidden="true">${e.ic}</div><h3>${esc(e.t)}</h3><div class="steps">${st}</div>${body}`);
  $('x')&&($('x').onclick=close);
  $('nx')&&($('nx').onclick=()=>openEvent(k,step+1));
  $('bk')&&($('bk').onclick=()=>openEvent(k,step-1));
  const f=$('doneForm');
  if(f)f.onsubmit=ev=>{ev.preventDefault();
    const r=readRecordForm(k);if(r.err)return showErr('fErr',r.err);
    if(S.sample)leaveSample();
    r.rec.fresh=true;applyRecord(k,r.rec,r.extra);
    close();save();render();celebrate([k]);checkAuto();};
}

function leaveSample(){S=blank()}

function celebrate(keys){
  if(!keys.length)return;const k=keys[0],e=BYK[k],v=S.done[k];const label=dayLabel(v.date);
  const colors=['--accent','--sticker','--pink','--leaf'];
  const conf=Array.from({length:28},(_,i)=>`<i style="left:${Math.random()*100}%;background:var(${colors[i%4]});animation-delay:${Math.random()*.4}s"></i>`).join('');
  $('layer').innerHTML=`<div class="confetti">${conf}</div><div class="cele" id="cele"><div class="card" role="dialog" aria-modal="true">
    <div class="stamp"><span class="e" aria-hidden="true">${e.ic}</span><span class="n">${fmtDate(v.date)}</span></div>
    <h4>${esc(e.done)}</h4><p>${esc(e.msg)}</p>
    ${label?`<p class="num" style="color:var(--ink)">${label}の出来事</p>`:''}
    <button class="btn" id="ok" style="margin-top:8px">年表に残す</button></div></div>`;
  $('ok').focus();
  $('ok').onclick=()=>{close();celebrate(keys.slice(1))};
}

// Pure: which automatic milestones are reached, and in which month.
function evalAuto(months){
  const ms=Object.keys(months).sort();let cum=0,streak=0;const hit={};
  const set=(k,m)=>{if(!hit[k])hit[k]=m};
  for(const m of ms){const v=months[m];cum+=v.s||0;streak=((v.s||0)-(v.e||0))>0?streak+1:0;
    if(cum>=100000)set('sales10',m);if(cum>=1000000)set('y100',m);if(cum>=3000000)set('y300',m);if(streak>=3)set('black3',m);}
  return hit;
}
function monthEnd(m){const end=new Date(m+'-01T00:00');end.setMonth(end.getMonth()+1);end.setDate(0);
  const d=end.getFullYear()+'-'+String(end.getMonth()+1).padStart(2,'0')+'-'+String(end.getDate()).padStart(2,'0');
  return d>todayStr()?todayStr():d}
function checkAuto(){
  const hit=evalAuto(S.months);const hits=[];let changed=false;
  for(const e of EVENTS.filter(e=>e.auto)){
    if(hit[e.k]&&!S.done[e.k]){S.done[e.k]={date:monthEnd(hit[e.k]),fresh:true};hits.push(e.k);changed=true}
    else if(!hit[e.k]&&S.done[e.k]){delete S.done[e.k];changed=true}
  }
  if(changed&&!hits.length){save();render()}
  if(hits.length){save();render();if(!$('layer').innerHTML)celebrate(hits);else{const q=hits;const ob=new MutationObserver(()=>{if(!$('layer').innerHTML){ob.disconnect();celebrate(q)}});ob.observe($('layer'),{childList:true})}}
}

$('monthForm').onsubmit=ev=>{ev.preventDefault();
  const m=$('mMonth').value;
  const s=parseYen($('mSales').value),x=parseYen($('mExp').value);
  if(!MONTH_RE.test(m))return showErr('mErr','月を選んでください。');
  if(Number.isNaN(s)||Number.isNaN(x))return showErr('mErr','金額は0以上の整数で入れてください。');
  $('mErr').hidden=true;
  if(S.sample)leaveSample();
  setMonth(m,{s,e:x});
  $('mSales').value='';$('mExp').value='';save();render();checkAuto();};
$('mMonth').value=todayStr().slice(0,7);

$('nowBtn').onclick=()=>{
  const c=curChapter();const list=EVENTS.filter(e=>e.ch===c);
  const next=EVENTS.filter(e=>!e.auto&&!S.done[e.k]).sort((a,b)=>a.ch-b.ch)[0];
  sheet(`<h3>今の${esc(shopName())}</h3><div class="steps"><span class="cur">第${c+1}章 ${CHAPTERS[c]}</span></div>
   <div class="check">${list.map(e=>`<div><span>${esc(e.t)}</span><span class="${S.done[e.k]?'ok':'no'}">${S.done[e.k]?'✓':e.auto?'自動':'未'}</span></div>`).join('')}</div>
   ${next?`<div class="reco">次は「<b>${esc(next.rec)}</b>」のがおすすめ。</div><div class="acts"><button class="btn ghost" id="x">閉じる</button><button class="btn" id="go">${esc(next.ic)} はじめる</button></div>`:'<p>用意した出来事はすべて記録しました。</p><div class="acts"><button class="btn" id="x">閉じる</button></div>'}`);
  $('x').onclick=close;$('go')&&($('go').onclick=()=>openEvent(next.k));
};

function openSettings(confirmReset){
  sheet(`<h3>${confirmReset?'まっさらから始めますか？':'お店の設定'}</h3>
   ${confirmReset?`<p class="warn">いま表示している見本の記録と数字はすべて消えます。</p><div class="acts"><button class="btn ghost" id="x">やめる</button><button class="btn" id="doReset">まっさらにする</button></div>`
   :`<form id="setForm" style="display:flex;flex-direction:column;gap:10px"><div class="field"><label for="sName">屋号</label><input id="sName" value="${esc(S.name)}" placeholder="例：かな商店"></div>
   <div class="field"><label for="sStart">開業日</label><input type="date" id="sStart" value="${esc(S.start)}"></div>
   <div class="acts"><button type="button" class="btn ghost" id="toReset">すべての記録を消す</button><button class="btn" type="submit">保存</button></div></form>`}`);
  $('x')&&($('x').onclick=close);
  $('doReset')&&($('doReset').onclick=()=>{S=blank();save();close();render()});
  $('toReset')&&($('toReset').onclick=()=>openSettings(true));
  const f=$('setForm');if(f)f.onsubmit=ev=>{ev.preventDefault();if(S.sample){const n=$('sName').value,st=$('sStart').value;S=blank();S.name=n.trim();S.start=st}else{S.name=$('sName').value.trim();S.start=$('sStart').value;if(S.done.opendate&&DATE_RE.test(S.start))S.done.opendate.date=S.start}save();close();render()};
}
$('shopname').onclick=()=>openSettings(false);
$('resetBtn').onclick=()=>openSettings(true);
document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
render();
</script>

</body>
