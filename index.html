<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ひとり商店。</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="wrap">
  <header style="display:flex;flex-direction:column;gap:6px">
    <div class="top">
      <div>
        <button class="shopname" id="shopname" aria-label="屋号と開業日を編集"></button>
        <div class="days" id="days"></div>
      </div>
      <div class="chapter" id="chapter"></div>
    </div>
    <div class="sample" id="sampleBar"><span>サンプル</span>表示中の数字と記録は見本です。<button class="linkbtn" id="resetBtn">まっさらから始める</button></div>
  </header>

  <div class="stats">
    <div class="stat"><small>累計売上</small><span class="num" id="sSales"></span></div>
    <div class="stat"><small>累計経費</small><span class="num" id="sExp"></span></div>
    <div class="stat profit"><small>利益</small><span class="num" id="sProfit"></span></div>
  </div>

  <div class="room" aria-label="仕事部屋">
    <svg viewBox="0 0 360 250" role="img" aria-label="自分の仕事部屋のイラスト。出来事を記録すると物が増える">
      <!-- awning: 初確定申告 -->
      <rect x="0" y="0" width="360" height="178" style="fill:var(--wall)"/>
      <rect x="0" y="150" width="360" height="28" style="fill:var(--wall2)"/>
      <rect x="0" y="178" width="360" height="72" style="fill:var(--floor)"/>
      <g style="stroke:var(--floor2)" stroke-width="2"><line x1="0" y1="205" x2="360" y2="205"/><line x1="0" y1="230" x2="360" y2="230"/></g>
      <!-- window -->
      <rect x="244" y="36" width="88" height="72" rx="4" style="fill:var(--sky);stroke:var(--ink)" stroke-width="3"/>
      <line x1="288" y1="36" x2="288" y2="108" style="stroke:var(--ink)" stroke-width="3"/>
      <line x1="244" y1="72" x2="332" y2="72" style="stroke:var(--ink)" stroke-width="3"/>
      <!-- desk (always) -->
      <rect x="112" y="150" width="152" height="10" rx="2" style="fill:var(--wood);stroke:var(--ink)" stroke-width="2.5"/>
      <rect x="122" y="160" width="8" height="40" style="fill:var(--wood);stroke:var(--ink)" stroke-width="2"/>
      <rect x="246" y="160" width="8" height="40" style="fill:var(--wood);stroke:var(--ink)" stroke-width="2"/>

      <g class="it" data-k="shinkoku">
        <path d="M0 0H360V14Q351 26 342 14Q333 26 324 14Q315 26 306 14Q297 26 288 14Q279 26 270 14Q261 26 252 14Q243 26 234 14Q225 26 216 14Q207 26 198 14Q189 26 180 14Q171 26 162 14Q153 26 144 14Q135 26 126 14Q117 26 108 14Q99 26 90 14Q81 26 72 14Q63 26 54 14Q45 26 36 14Q27 26 18 14Q9 26 0 14Z" style="fill:var(--pink);stroke:var(--ink)" stroke-width="2"/>
        <g style="fill:var(--paper)" opacity=".85"><rect x="18" y="0" width="18" height="14"/><rect x="54" y="0" width="18" height="14"/><rect x="90" y="0" width="18" height="14"/><rect x="126" y="0" width="18" height="14"/><rect x="162" y="0" width="18" height="14"/><rect x="198" y="0" width="18" height="14"/><rect x="234" y="0" width="18" height="14"/><rect x="270" y="0" width="18" height="14"/><rect x="306" y="0" width="18" height="14"/><rect x="342" y="0" width="18" height="14"/></g>
      </g>
      <!-- sign: 屋号 -->
      <g class="it" data-k="yago">
        <line x1="40" y1="22" x2="40" y2="34" style="stroke:var(--ink)" stroke-width="2"/>
        <line x1="150" y1="22" x2="150" y2="34" style="stroke:var(--ink)" stroke-width="2"/>
        <rect x="24" y="32" width="142" height="34" rx="6" style="fill:var(--paper);stroke:var(--ink)" stroke-width="3"/>
        <text id="signText" x="95" y="55" text-anchor="middle" style="fill:var(--ink);font-family:var(--display);font-weight:900;font-size:16px"></text>
      </g>
      <!-- OPEN: 開業届 -->
      <g class="it" data-k="kaigyo">
        <line x1="78" y1="66" x2="70" y2="78" style="stroke:var(--ink)" stroke-width="1.5"/>
        <line x1="112" y1="66" x2="120" y2="78" style="stroke:var(--ink)" stroke-width="1.5"/>
        <rect x="62" y="78" width="66" height="22" rx="4" style="fill:var(--sticker);stroke:var(--ink)" stroke-width="2.5"/>
        <text x="95" y="94" text-anchor="middle" style="fill:#2B2410;font-family:var(--mono);font-weight:500;font-size:13px;letter-spacing:2px">OPEN</text>
      </g>
      <!-- calendar: 開業日 -->
      <g class="it" data-k="opendate">
        <rect x="186" y="44" width="38" height="44" rx="3" style="fill:var(--paper);stroke:var(--ink)" stroke-width="2.5"/>
        <rect x="186" y="44" width="38" height="12" rx="3" style="fill:var(--pink);stroke:var(--ink)" stroke-width="2.5"/>
        <text x="205" y="81" text-anchor="middle" style="fill:var(--ink);font-family:var(--mono);font-size:16px">1</text>
      </g>
      <!-- shelf: 売上10万 -->
      <g class="it" data-k="sales10">
        <rect x="14" y="118" width="88" height="6" style="fill:var(--wood);stroke:var(--ink)" stroke-width="2"/>
        <rect x="20" y="96" width="10" height="22" style="fill:var(--accent);stroke:var(--ink)" stroke-width="1.5"/>
        <rect x="31" y="100" width="10" height="18" style="fill:var(--sticker);stroke:var(--ink)" stroke-width="1.5"/>
        <rect x="42" y="94" width="10" height="24" style="fill:var(--pink);stroke:var(--ink)" stroke-width="1.5"/>
      </g>
      <!-- trophy: 単価を上げた -->
      <g class="it" data-k="raise">
        <path d="M74 98h18v6q0 9-9 9t-9-9z" style="fill:var(--sticker);stroke:var(--ink)" stroke-width="1.8"/>
        <rect x="79" y="112" width="8" height="6" style="fill:var(--sticker);stroke:var(--ink)" stroke-width="1.5"/>
      </g>
      <!-- frame: リピーター -->
      <g class="it" data-k="repeat">
        <rect x="200" y="100" width="32" height="26" rx="2" style="fill:var(--paper);stroke:var(--ink)" stroke-width="2.5"/>
        <path d="M216 120c-6-4-8-7-6-9.5 1.5-1.8 4.5-1 6 1.2 1.5-2.2 4.5-3 6-1.2 2 2.5 0 5.5-6 9.5z" style="fill:var(--pink)"/>
      </g>
      <!-- pc: 会計ソフト -->
      <g class="it" data-k="software">
        <rect x="196" y="116" width="52" height="34" rx="3" style="fill:var(--ink)"/>
        <rect x="200" y="120" width="44" height="24" style="fill:var(--accent-soft)"/>
        <polyline points="204,138 214,132 222,135 238,124" fill="none" style="stroke:var(--accent)" stroke-width="2.5"/>
      </g>
      <!-- register: 事業口座 -->
      <g class="it" data-k="bank">
        <rect x="124" y="126" width="44" height="24" rx="3" style="fill:var(--accent);stroke:var(--ink)" stroke-width="2.5"/>
        <rect x="130" y="118" width="26" height="10" rx="2" style="fill:var(--paper);stroke:var(--ink)" stroke-width="2"/>
        <g style="fill:var(--paper)"><rect x="130" y="134" width="6" height="4"/><rect x="139" y="134" width="6" height="4"/><rect x="148" y="134" width="6" height="4"/><rect x="130" y="141" width="6" height="4"/><rect x="139" y="141" width="6" height="4"/></g>
      </g>
      <!-- envelope: 初請求 -->
      <g class="it" data-k="invoice">
        <rect x="172" y="136" width="22" height="14" style="fill:var(--paper);stroke:var(--ink)" stroke-width="2"/>
        <polyline points="172,136 183,145 194,136" fill="none" style="stroke:var(--ink)" stroke-width="1.8"/>
      </g>
      <!-- ledger: 初経費 -->
      <g class="it" data-k="expense">
        <rect x="170" y="128" width="24" height="7" rx="1" style="fill:var(--leaf);stroke:var(--ink)" stroke-width="1.8"/>
      </g>
      <!-- card: 事業用カード -->
      <g class="it" data-k="card">
        <rect x="250" y="141" width="12" height="9" rx="1.5" style="fill:var(--sticker);stroke:var(--ink)" stroke-width="1.5"/>
      </g>
      <!-- memo: 見積書 -->
      <g class="it" data-k="estimate">
        <rect x="108" y="128" width="12" height="16" style="fill:var(--sticker);stroke:var(--ink)" stroke-width="1.5" transform="rotate(-8 114 136)"/>
      </g>
      <!-- plant: 初入金 -->
      <g class="it" data-k="payment">
        <ellipse cx="300" cy="166" rx="10" ry="18" style="fill:var(--leaf);stroke:var(--ink)" stroke-width="2" transform="rotate(-25 300 166)"/>
        <ellipse cx="318" cy="164" rx="10" ry="20" style="fill:var(--leaf);stroke:var(--ink)" stroke-width="2" transform="rotate(22 318 164)"/>
        <ellipse cx="309" cy="156" rx="8" ry="20" style="fill:var(--leaf);stroke:var(--ink)" stroke-width="2"/>
        <path d="M294 182h30l-4 26h-22z" style="fill:var(--pink);stroke:var(--ink)" stroke-width="2.5"/>
      </g>
      <!-- corkboard: 年金・保険・失業保険・県の届け出 -->
      <g class="it" data-any="nenkin kenpo koyo kenzei">
        <rect x="136" y="72" width="44" height="40" rx="3" style="fill:var(--floor);stroke:var(--ink)" stroke-width="2.5"/>
      </g>
      <g class="it" data-k="nenkin"><rect x="141" y="77" width="14" height="13" style="fill:var(--accent)"/></g>
      <g class="it" data-k="kenpo"><rect x="160" y="77" width="14" height="13" style="fill:var(--pink)" transform="rotate(6 167 83)"/></g>
      <g class="it" data-k="koyo"><rect x="141" y="94" width="14" height="13" style="fill:var(--sticker)" transform="rotate(-5 148 100)"/></g>
      <g class="it" data-k="kenzei">
        <circle cx="167" cy="100" r="7" style="fill:var(--paper);stroke:var(--danger)" stroke-width="2"/>
        <text x="167" y="103.5" text-anchor="middle" style="fill:var(--danger);font-family:var(--display);font-weight:900;font-size:9px">県</text>
      </g>
      <!-- sticker on window: インボイス -->
      <g class="it" data-k="invoice_reg">
        <circle cx="318" cy="50" r="8" style="fill:var(--sticker);stroke:var(--ink)" stroke-width="1.8"/>
        <text x="318" y="54" text-anchor="middle" style="fill:#2B2410;font-family:var(--mono);font-weight:500;font-size:10px">T</text>
      </g>
      <!-- file box: 書類の保存 -->
      <g class="it" data-k="hozon">
        <rect x="218" y="174" width="24" height="26" rx="2" style="fill:var(--accent-soft);stroke:var(--ink)" stroke-width="2"/>
        <line x1="224" y1="180" x2="224" y2="196" style="stroke:var(--accent)" stroke-width="2"/>
        <line x1="230" y1="180" x2="230" y2="196" style="stroke:var(--pink)" stroke-width="2"/>
        <line x1="236" y1="180" x2="236" y2="196" style="stroke:var(--leaf)" stroke-width="2"/>
      </g>
      <!-- envelope on the box: 源泉徴収票 -->
      <g class="it" data-k="gensen">
        <rect x="181" y="163" width="22" height="9" style="fill:var(--paper);stroke:var(--ink)" stroke-width="1.6"/>
        <polyline points="181,163 192,169 203,163" fill="none" style="stroke:var(--ink)" stroke-width="1.4"/>
      </g>
      <!-- clipboard: 取引条件 -->
      <g class="it" data-k="joken">
        <rect x="252" y="114" width="20" height="26" rx="2" style="fill:var(--wood);stroke:var(--ink)" stroke-width="2"/>
        <rect x="255" y="119" width="14" height="18" style="fill:var(--paper)"/>
        <rect x="257" y="111" width="10" height="5" rx="1" style="fill:var(--ink)"/>
      </g>
      <!-- 2年目へ: calculator / tax notice / coins / piggy bank on the floor -->
      <g class="it" data-k="shohizei">
        <rect x="238" y="208" width="18" height="24" rx="2" style="fill:var(--ink)"/>
        <rect x="241" y="211" width="12" height="6" style="fill:var(--leaf)"/>
      </g>
      <g class="it" data-k="jigyozei">
        <rect x="264" y="212" width="20" height="24" style="fill:var(--paper);stroke:var(--ink)" stroke-width="1.8"/>
        <text x="274" y="228" text-anchor="middle" style="fill:var(--ink);font-family:var(--display);font-weight:900;font-size:10px">事</text>
      </g>
      <g class="it" data-k="yotei">
        <ellipse cx="304" cy="232" rx="9" ry="3.5" style="fill:var(--sticker);stroke:var(--ink)" stroke-width="1.4"/>
        <ellipse cx="304" cy="227" rx="9" ry="3.5" style="fill:var(--sticker);stroke:var(--ink)" stroke-width="1.4"/>
        <ellipse cx="304" cy="222" rx="9" ry="3.5" style="fill:var(--sticker);stroke:var(--ink)" stroke-width="1.4"/>
      </g>
      <g class="it" data-k="ideco">
        <ellipse cx="335" cy="225" rx="13" ry="10" style="fill:var(--pink);stroke:var(--ink)" stroke-width="2"/>
        <path d="M328 217l2-5 4 4z" style="fill:var(--pink);stroke:var(--ink)" stroke-width="1.5"/>
        <rect x="331" y="216" width="8" height="2" style="fill:var(--ink)"/>
        <circle cx="344" cy="224" r="2.5" style="fill:var(--paper);stroke:var(--ink)" stroke-width="1"/>
      </g>
      <!-- box: 退職 -->
      <g class="it" data-k="taishoku">
        <rect x="172" y="172" width="42" height="28" rx="2" style="fill:var(--floor2);stroke:var(--ink)" stroke-width="2.5"/>
        <line x1="193" y1="172" x2="193" y2="184" style="stroke:var(--ink)" stroke-width="2"/>
        <rect x="185" y="180" width="16" height="6" style="fill:var(--sticker)"/>
      </g>
      <!-- tax: 税金 -->
      <g class="it" data-k="tax">
        <rect x="40" y="186" width="34" height="26" rx="3" style="fill:var(--paper);stroke:var(--ink)" stroke-width="2"/>
        <text x="57" y="204" text-anchor="middle" style="fill:var(--ink);font-family:var(--display);font-weight:900;font-size:12px">納</text>
      </g>
      <!-- rug: 年商100万 -->
      <g class="it" data-k="y100">
        <ellipse cx="190" cy="226" rx="70" ry="14" style="fill:var(--accent-soft);stroke:var(--accent)" stroke-width="2.5" stroke-dasharray="6 4"/>
      </g>
    </svg>
    <div class="roomhint" id="roomhint"></div>
  </div>

  <button class="nowbtn" id="nowBtn">いま何すればいい？</button>

  <section>
    <h2>次の出来事 <small>タップすると「なぜ→どうやる→できた」まで進めます</small></h2>
    <div class="events" id="events"></div>
  </section>

  <section>
    <h2>今月のお金 <small>月に1回だけ入れればOK</small></h2>
    <form class="month" id="monthForm" novalidate>
      <div class="row">
        <div class="field"><label for="mMonth">月</label><input type="month" id="mMonth" required></div>
        <div class="field"><label for="mSales">売上（円）</label><input type="number" id="mSales" min="0" step="1" inputmode="numeric" placeholder="0"></div>
        <div class="field"><label for="mExp">経費（円）</label><input type="number" id="mExp" min="0" step="1" inputmode="numeric" placeholder="0"></div>
        <button class="btn" type="submit">記録</button>
      </div>
      <p class="err" id="mErr" hidden></p>
      <div class="mlist" id="mlist"></div>
    </form>
  </section>

  <section class="history">
    <div class="hist-head">MY BUSINESS HISTORY<span class="hint">タップで直せます</span></div>
    <div id="history"></div>
  </section>
  <section class="account" id="account" aria-label="アカウント"></section>
</div>

<div id="layer"></div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
